# ============================================================================
# MCQ Junction — Isolated Disposable PostgreSQL Test Environment
# File: docker-compose.test.yml
# ============================================================================

services:
  mcqj-postgres-test:
    image: postgres:16
    container_name: mcqj-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Environment variable TEST_DB_PASSWORD is required for disposable test container}
      POSTGRES_DB: mcq_junction_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcq_junction_test"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: "no"
